{%load static%}
<!--slider style-->
<style>
	/* Slider Content Improvements */
.slider-content {
    padding: 40px 20px;
    text-align: center;
}

.slider-content h1 {
    font-size: 3.5rem;
    font-weight: 700;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
    margin-bottom: 20px;
    line-height: 1.2;
}

.slider-content h2 {
    font-size: 2.5rem;
    font-weight: 600;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    margin-bottom: 25px;
    line-height: 1.3;
}

.slider-content p {
    font-size: 1.2rem;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
    margin-bottom: 35px;
    line-height: 1.6;
}

.slider-buttons {
    margin-top: 30px;
}

.btn-circle {
    border-radius: 50px;
    padding: 15px 30px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    border-width: 2px;
}

.btn-outline-new-white {
    color: #fff;
    border-color: #fff;
    background: transparent;
}

.btn-outline-new-white:hover {
    background: #008080;
    border-color: #008080;
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .slider-content h1 {
        font-size: 2.5rem;
    }

    .slider-content h2 {
        font-size: 2rem;
    }

    .slider-content p {
        font-size: 1.1rem;
    }

    .slider-buttons .btn {
        display: block;
        margin: 10px auto;
        min-width: 200px;
    }
}

@media (max-width: 576px) {
    .slider-content h1 {
        font-size: 2rem;
    }

    .slider-content h2 {
        font-size: 1.5rem;
    }

    .slider-content {
        padding: 20px 15px;
    }

    .btn-lg {
        padding: 12px 25px;
        font-size: 0.9rem;
    }
}

/* Ensure text is readable over images */
.cover-slides .container {
    position: relative;
    z-index: 10;
}

/* Optional: Add overlay for better text readability */
.slides-container li::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.3);
    z-index: 1;
}

.slides-container li > * {
    position: relative;
    z-index: 2;
}
</style>

<!-- Start slides -->
<div id="slides" class="cover-slides">
    <ul class="slides-container">
        {%for rs in gallery%}
        <li class="text-center">
            <img src="{{rs.image.url}}" alt="{{rs.title}}">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-12 col-lg-12">
                        <div class="slider-content" style="padding-top: 100px;">  <!-- Added padding-top -->
                            <h1 class="m-b-20" style="margin-top: 30px;"><strong>Welcome To<br>{{hotel.name}}</strong></h1>  <!-- Added margin-top -->
                            <hr style="border-color: #fff; width: 100px; margin: 20px auto;">
                            <h2 class="m-b-20" style="font-size: 2.5rem; color: #008081;">
                                <strong>{{rs.title}}</strong>
                            </h2>

                            <p class="m-b-40" style="font-size: 1.2rem; line-height: 1.6;">
                                Discover our brand luxurious Hospitality.<br>
                                <b>{{hotel.tagline|safe}}.</b>
                            </p>

                            <!-- Centered button group -->
                            <div class="slider-buttons text-center" style="margin-top: 30px;">  <!-- Added margin-top -->
                                <a class="btn btn-lg btn-circle btn-outline-new-white" href="/accommodations"
                                   style="margin: 5px 10px; min-width: 180px;">
                                    Book A Room
                                </a>
                                <a class="btn btn-lg btn-circle btn-outline-new-white" href="/service_list"
                                   style="margin: 5px 10px; min-width: 180px;">
                                    Reservations
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </li>
        {%endfor%}
    </ul>
    <div class="slides-navigation">
        <a href="#" class="next"><i class="fa fa-angle-right" aria-hidden="true"></i></a>
        <a href="#" class="prev"><i class="fa fa-angle-left" aria-hidden="true"></i></a>
    </div>
</div>
<!-- End slides -->
